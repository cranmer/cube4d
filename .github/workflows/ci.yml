name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the app
        # A compile check, not a deployable artifact — this job has no JDK, so it cannot export
        # puzzle geometry. The Pages workflow does, and refuses to deploy without the full set.
        run: npm run build --workspace @mc4d/app
        env:
          MC4D_ALLOW_PARTIAL_ASSETS: '1'

  assets:
    # Puzzle geometry is generated by the original Java, and grip indices in it are a wire format:
    # every move in every .log file ever saved is an index into a generated array. So regenerate it
    # from scratch and prove the result is still compatible.
    #
    # Note what is NOT checked: byte-for-byte reproducibility. java.lang.Math's sin and cos are
    # specified only to within 1-2 ulp rather than bit-exactly, so a polygon whose vertex angles
    # are not nice fractions of pi comes out differing in the last bit between arm64 and x64.
    # Structure and behaviour are identical; the bits are not. Pinning the bits would fail forever
    # for reasons that do not matter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tools/exporter/build.sh
      - run: tools/exporter/export.sh

      - name: Grip ordering and piece structure must be unchanged
        # These fields pin what compatibility actually depends on. A change to any of them means
        # grip indices have moved and every saved solve would be reinterpreted.
        run: |
          fields='[.puzzles[] | {id, nFaces, nCubies, nStickers, nGrips, nVerts, bytes}]'
          git show HEAD:fixtures/manifest.json | jq -S "$fields" > /tmp/committed.json
          jq -S "$fields" fixtures/manifest.json > /tmp/regenerated.json
          diff -u /tmp/committed.json /tmp/regenerated.json

      - name: Regenerated geometry must still match the committed golden permutations
        # The real compatibility test. Restore the goldens the exporter just overwrote, so the
        # freshly generated geometry is checked against permutations recorded on a different
        # machine and architecture. If twisting still agrees move for move, the geometry is
        # compatible however the last bits landed.
        run: |
          git checkout -- fixtures/perm
          npm test --workspace @mc4d/puzzle-core
