name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @mc4d/app

  assets:
    # Puzzle geometry is generated by the original Java, and grip indices in it are a wire format:
    # every move in every .log file ever saved is an index into a generated array. Regenerate and
    # compare hashes so a toolchain change can never silently invalidate saved solves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: tools/exporter/build.sh
      - run: tools/exporter/export.sh
      - name: Fixtures must be unchanged
        run: git diff --exit-code -- fixtures/
