name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Puzzle geometry is generated by the original Java, so the deploy needs a JDK. Without this
      # step only the handful of assets committed as test fixtures exist, and the build ships a
      # catalog whose buttons mostly 404.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Export puzzle geometry
        run: tools/exporter/build.sh && tools/exporter/export.sh
      - name: Build
        run: npm run build --workspace @mc4d/web
        env:
          # Project pages are served from /<repo>/, so assets must resolve relative to it.
          MC4D_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
